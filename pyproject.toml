[project]
name = "learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nirzar-Diwan", email = "nirzar.diwan@innvonix.in" }
]
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.16.0",
    "deepagents>=0.7.39",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mem0ai>=2.2.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
learning = "learning:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
